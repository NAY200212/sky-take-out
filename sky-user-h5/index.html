<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>苍穹外卖</title>
  <link rel="icon" href="/Users/mimashi0000/Desktop/1、黑马程序员Java项目《苍穹外卖》企业级开发实战/前端源码/苍穹外卖前端源码/苍穹外卖前端源码/project-sky-admin-vue-ts/public/img/icons/favicon-32x32.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- 登录页 -->
    <div id="page-login" class="page active">
      <div class="login-container">
        <div class="login-logo">
          <img class="logo-icon" src="/Users/mimashi0000/Desktop/1、黑马程序员Java项目《苍穹外卖》企业级开发实战/前端源码/苍穹外卖前端源码/苍穹外卖前端源码/project-sky-admin-vue-ts/public/img/icons/favicon-32x32.png" alt="logo">
          <h1>苍穹外卖</h1>
          <p>美味即刻送达</p>
        </div>
        <div class="login-form">
          <input type="text" id="login-nickname" placeholder="请输入您的昵称或编号" autocomplete="off">
          <button id="btn-login" class="btn-primary">进入点餐</button>
        </div>
      </div>
    </div>

    <!-- 首页 -->
    <div id="page-home" class="page">
      <div class="home-header">
        <div class="header-title">苍穹外卖</div>
        <div class="header-user" id="header-user"></div>
      </div>
      <div class="home-content">
        <div class="category-sidebar" id="category-sidebar"></div>
        <div class="dish-area" id="dish-area">
          <div class="dish-empty">请选择左侧分类</div>
        </div>
      </div>
    </div>

    <!-- 购物车页 -->
    <div id="page-cart" class="page">
      <div class="page-header">
        <div class="back-btn" data-page="home">←</div>
        <div class="header-title">购物车</div>
        <div class="header-action" id="btn-clear-cart">清空</div>
      </div>
      <div class="cart-list" id="cart-list">
        <div class="empty-state">购物车空空如也</div>
      </div>
      <div class="cart-footer" id="cart-footer" style="display:none;">
        <div class="cart-total">
          <span class="total-label">合计：</span>
          <span class="total-price" id="cart-total-price">¥0.00</span>
        </div>
        <button class="btn-primary" id="btn-checkout">去结算</button>
      </div>
    </div>

    <!-- 结算页 -->
    <div id="page-checkout" class="page">
      <div class="page-header">
        <div class="back-btn" data-page="cart">←</div>
        <div class="header-title">确认下单</div>
        <div></div>
      </div>
      <div class="checkout-content">
        <div class="checkout-section">
          <div class="checkout-label">订单金额</div>
          <div class="checkout-amount" id="checkout-amount">¥0.00</div>
        </div>
        <div class="checkout-section" id="checkout-address-section">
          <div class="checkout-label">收货地址</div>
          <div class="checkout-address-select" id="checkout-address">
            <div class="address-loading">加载地址中...</div>
          </div>
        </div>
        <div class="checkout-section">
          <div class="checkout-label">备注</div>
          <textarea id="checkout-remark" placeholder="选填，如有特殊要求请备注"></textarea>
        </div>
        <button class="btn-primary btn-block" id="btn-submit-order">确认下单</button>
      </div>
    </div>

    <!-- 订单页 -->
    <div id="page-orders" class="page">
      <div class="page-header">
        <div class="back-btn" data-page="home">←</div>
        <div class="header-title">我的订单</div>
        <div></div>
      </div>
      <div class="orders-filter">
        <button class="filter-btn active" data-status="">全部</button>
        <button class="filter-btn" data-status="1">待付款</button>
        <button class="filter-btn" data-status="2">待接单</button>
        <button class="filter-btn" data-status="3">已接单</button>
        <button class="filter-btn" data-status="4">派送中</button>
        <button class="filter-btn" data-status="5">已完成</button>
        <button class="filter-btn" data-status="6">已取消</button>
      </div>
      <div class="orders-list" id="orders-list">
        <div class="empty-state">暂无订单</div>
      </div>
    </div>

    <!-- 详情弹窗 -->
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal-content" id="modal-content"></div>
    </div>

    <!-- 底部导航 -->
    <nav class="bottom-nav" id="bottom-nav" style="display:none;">
      <div class="nav-item active" data-page="home">
        <div class="nav-icon nav-icon-home"></div>
        <span>首页</span>
      </div>
      <div class="nav-item" data-page="cart">
        <div class="nav-icon nav-icon-cart"></div>
        <span>购物车</span>
        <span class="cart-badge" id="cart-badge" style="display:none;">0</span>
      </div>
      <div class="nav-item" data-page="orders">
        <div class="nav-icon nav-icon-orders"></div>
        <span>订单</span>
      </div>
      <div class="nav-item" data-page="logout">
        <div class="nav-icon nav-icon-logout"></div>
        <span>退出</span>
      </div>
    </nav>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
